<style>
:root{--navy:#2F5881;--pink:#FF78A7;--rose:#FFCDE5;--blush:#FFEDF1;--mist:#B8C4CA;
--bg:#FFEDF1;--surface:#fff;--ink:#1E3A58;--muted:#5F7387;--line:rgba(47,88,129,.16);--chip:#FFCDE5;--outer:#FFCDE5;--cink:#2F5881;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#142A42;--surface:#1D3B5C;--ink:#FFEDF1;--muted:#B8C4CA;--line:rgba(184,196,202,.22);--chip:#2F5881;--outer:#0F2033;--cink:#FFEDF1}}
:root[data-theme="dark"]{--bg:#142A42;--surface:#1D3B5C;--ink:#FFEDF1;--muted:#B8C4CA;--line:rgba(184,196,202,.22);--chip:#2F5881;--outer:#0F2033;--cink:#FFEDF1}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--outer);font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;align-items:center}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.app{width:100%;max-width:410px;height:100%;max-height:840px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (min-width:520px){.app{border-radius:36px;box-shadow:0 30px 70px rgba(30,58,88,.28);height:min(840px,94%)}}
main{flex:1;overflow-y:auto;padding:20px 18px 12px}
.screen{display:none}.screen.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top p{color:var(--muted);font-size:14px}
.top h2{font-size:24px;font-weight:800}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--pink);color:var(--navy);font-weight:700;display:grid;place-items:center}
/* hero */
.hero{position:relative;border-radius:28px;background:var(--navy);color:var(--blush);padding:22px 20px 20px;overflow:hidden;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero>div{position:relative;background:rgba(47,88,129,.88);margin:-6px;padding:14px;border-radius:20px}
.hero h1{font-size:32px;line-height:1;font-weight:800}
.hero p{font-size:14px;margin-top:6px;color:var(--rose)}
.meter{height:8px;border-radius:8px;background:rgba(255,237,241,.25);margin:14px 0 6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pink);border-radius:8px;transition:width .4s}
.hero small{font-size:13px}
.btn{background:var(--pink);color:var(--navy);font-weight:700;border-radius:999px;padding:12px 18px;margin-top:12px;display:inline-block}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 6px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500}
.quick span{width:54px;height:54px;border-radius:20px;background:var(--chip);display:grid;place-items:center;color:var(--navy)}
:root[data-theme="dark"] .quick span{color:var(--blush)}
.quick svg,.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h3{font-size:19px;margin:22px 0 10px}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.trip{flex:0 0 150px;border-radius:22px;padding:14px;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--navy)}
.trip b{font-family:'Bricolage Grotesque',sans-serif;font-size:18px}
.trip span{font-size:13px}
/* plan */
.days{display:flex;gap:8px;overflow-x:auto;margin:4px 0 18px;scrollbar-width:none}
.day{flex:0 0 auto;padding:10px 16px;border-radius:18px;background:var(--surface);border:1px solid transparent;text-align:left}
.day b{display:block;font-size:15px}.day span{font-size:12px;color:var(--muted)}
.day[aria-selected="true"]{background:var(--pink);border-color:var(--pink);color:var(--navy)}
.day[aria-selected="true"] span{color:var(--navy)}
.tl{list-style:none;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:15px;top:10px;bottom:10px;width:2px;background:var(--mist)}
.stop{display:flex;gap:14px;margin-bottom:14px;position:relative}
.dot{flex:0 0 32px;height:32px;border-radius:50%;background:var(--bg);border:2px solid var(--navy);display:grid;place-items:center;z-index:1;color:transparent}
:root[data-theme="dark"] .dot{border-color:var(--mist)}
.stop.done .dot{background:var(--pink);border-color:var(--pink);color:var(--navy)}
.card{flex:1;background:var(--surface);border-radius:18px;padding:12px 14px;border:1px solid transparent;text-align:left}
.card time{font-size:12px;color:var(--muted);font-weight:700}
.card b{display:block;font-size:16px;margin:2px 0}
.card span{font-size:13px;color:var(--muted)}
.stop.done .card b{color:var(--pink)!important;text-decoration:none}
/* explore */
.search{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid transparent;border-radius:999px;padding:12px 16px;color:var(--muted);margin-bottom:12px}
.search svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:500;color:var(--navy)}
:root[data-theme="dark"] .chip{color:var(--blush)}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--blush)}
.place{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid transparent;border-radius:20px;padding:10px;margin-bottom:10px}
.thumb{flex:0 0 64px;height:64px;border-radius:16px;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;color:var(--navy)}
.place div{flex:1}.place b{display:block}.place span{font-size:13px;color:var(--muted)}
.add{padding:8px 14px;border-radius:999px;border:2px solid var(--pink);font-weight:700;font-size:14px}
.add[aria-pressed="true"]{background:var(--pink);color:var(--navy)}
/* budget */
.sum{background:var(--navy);color:var(--blush);border-radius:28px;padding:22px}
.sum h1{font-size:40px;font-weight:800}.sum p{color:var(--rose);font-size:14px}
.bars{margin-top:18px;display:grid;gap:16px}
.bar header{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px}
.bar header span{color:var(--muted)}
.track{height:12px;border-radius:12px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:12px}
/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:10px 12px 14px;background:var(--surface);border-top:0}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;padding:6px 0;border-radius:16px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--pink);color:var(--navy);font-weight:700}
[hidden]{display:none!important}
.chip,.quick span{color:var(--cink)}
:root .chip[aria-pressed="true"]{background:var(--pink);color:var(--navy)}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--cink)}
.seg button[aria-pressed="true"]{background:var(--pink);color:var(--navy)}
.mates-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.mates-row .l{font-size:13px;color:var(--muted)}
#mates{display:flex}
.mate{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:2px solid var(--bg);margin-left:-8px;flex:0 0 34px}
#mates .mate:first-child,.panel .mate{margin-left:0}
.addmate{padding:7px 12px;border:2px dashed var(--pink);border-radius:999px;font-size:13px;font-weight:700}
.scene{display:block;width:100%;border-radius:24px;box-shadow:none}
.cap{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid transparent;border-radius:18px;padding:12px 14px;margin-top:12px}
.cap time{font-size:12px;color:var(--muted);font-weight:700}.cap b{display:block;font-size:16px}.cap span{font-size:13px;color:var(--muted)}
.cap .btn{margin:0;padding:10px 16px;white-space:nowrap}
.cap .btn[aria-pressed="true"]{background:var(--mist)}
@keyframes wv{to{transform:translateX(-60px)}}
@keyframes drift{from{transform:translateX(-25px)}to{transform:translateX(35px)}}
@keyframes fog{from{transform:translateX(-28px);opacity:.4}to{transform:translateX(30px);opacity:.75}}
@keyframes boat{from{transform:translate(-30px,0)}to{transform:translate(40px,-2px)}}
@keyframes fly{from{transform:translate(-40px,0)}to{transform:translate(430px,-18px)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.2);opacity:.55}}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.8);opacity:0}}
.wv{animation:wv 5s linear infinite}
.drift,.fog,.sail{animation:drift 14s ease-in-out infinite alternate}
.fog{filter:blur(5px);animation-name:fog}
.sail{animation-name:boat;animation-duration:9s}
.bird{animation:fly 26s linear infinite}
.glow{animation:pulse 4s ease-in-out infinite}
.sway{animation:sway 4s ease-in-out infinite alternate}
.flow{animation:dash 2.5s linear infinite}
.ring{animation:ring 1.8s ease-out infinite}
.cmh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cmh button{width:38px;height:38px;border-radius:50%;background:var(--chip);font-size:20px;color:var(--cink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;background:var(--surface);border-radius:24px;padding:14px 10px;border:1px solid transparent}
.wd{font-style:normal;text-align:center;font-size:12px;color:var(--muted)}
.cd{height:38px;display:grid;place-items:center;font-size:14px;font-weight:500}
.cd.today{outline:2px solid var(--pink);outline-offset:-3px;border-radius:50%}
.t-dn{background:var(--navy);color:var(--blush)}.t-dl{background:var(--pink);color:var(--navy)}.t-vt{background:var(--mist);color:var(--navy)}
.cd.s{border-radius:20px 0 0 20px}.cd.e{border-radius:0 20px 20px 0}.cd.s.e{border-radius:20px}
.crow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid transparent;border-radius:18px;padding:12px;margin-bottom:10px}
.crow b{display:block}.crow span{font-size:13px;color:var(--muted)}
.sw{width:14px;height:40px;border-radius:8px;flex:0 0 14px}
.sheet{position:absolute;inset:0;z-index:10;display:flex;align-items:flex-end}
.scrim{position:absolute;inset:0;background:rgba(20,42,66,.55)}
.panel{position:relative;width:100%;background:var(--surface);border-radius:28px 28px 0 0;padding:20px 18px 26px}
.panel ul{list-style:none;padding:0;margin:0 0 14px}
.panel li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.panel li b{flex:1}.panel li button{font-size:13px;color:var(--muted);text-decoration:underline}
.panel label{font-size:14px;color:var(--muted)}
.panel input{width:100%;padding:12px 16px;border-radius:999px;border:1px solid transparent;background:var(--bg);color:var(--ink);font:inherit;margin-top:6px}
.panel .btn{width:100%;margin-top:12px}
.panel .close{display:block;margin:12px auto 0;font-weight:700}
.card,.place,.crow,.day,.trip,.chip,.add,.btn,.seg button,.addmate,.mate,.tabs button,.cmh button,.cd,.avatar,.quick span,.dot{transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,color .18s ease,border-color .18s ease}
.sc-wrap{position:relative}
.tip{position:absolute;z-index:3;pointer-events:none;padding:8px 12px;border-radius:12px;background:var(--pi);color:var(--pl);font-size:12px;line-height:1.35;transform:translate(-50%,-100%);white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tip b{display:block;font-size:13px}
.node circle.n{transition:transform .15s;transform-box:fill-box;transform-origin:center}
.node:hover circle.n,.node:focus-visible circle.n{transform:scale(1.22)}
.node:focus{outline:none}
.cap .eta{display:block;margin-top:4px;color:var(--ink);font-weight:500}
@media (hover:hover){
.card:hover,.place:hover,.crow:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(47,88,129,.18);border-color:var(--pink)}
.day:hover{border-color:var(--pink);transform:translateY(-2px)}
.stop:hover .dot{border-color:var(--pink);transform:scale(1.12)}
.trip:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:0 12px 24px rgba(47,88,129,.22)}
.quick button:hover span{background:var(--pink);color:var(--navy);transform:translateY(-3px) scale(1.06)}
.chip:hover,.add:hover,.cmh button:hover{background:var(--pink);color:var(--navy)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(255,120,167,.5)}
.seg button:hover:not([aria-pressed="true"]){background:rgba(255,120,167,.35)}
.tabs button:hover:not([aria-selected="true"]){background:var(--chip);color:var(--ink)}
.addmate:hover{background:var(--pink);color:var(--navy);border-style:solid}
.mate:hover{transform:translateY(-3px);z-index:2}
button.cd:hover{transform:scale(1.12);filter:brightness(1.08);z-index:1}
.avatar:hover{transform:rotate(10deg)}
.panel li button:hover{color:var(--pink)}
.bar:hover .track i{filter:brightness(1.12)}
.bar:hover header b{color:var(--pink)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== v2: plans / destinations / stops ===== */
.top{flex-wrap:wrap;gap:10px}
.muted{color:var(--muted);font-size:13px}
.hero{min-height:270px}
.hero>.hd{position:absolute;top:12px;left:12px;right:12px;background:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;border-radius:0}
.hero .hd button{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.9);color:#1E3A58;font-size:12px;font-weight:700;transition:transform .15s,background-color .15s}
.hero .hd button[aria-pressed="true"]{background:var(--pink)}
.hp{max-width:100%}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:var(--surface);border:1px solid transparent;font-weight:700;font-size:14px;transition:transform .18s,box-shadow .18s,border-color .18s,background-color .18s}
.hrow{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.hrow h3{margin:0}
.plusb,.ico{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:var(--chip);color:var(--cink);flex:0 0 34px;transition:transform .15s,background-color .15s,color .15s}
.plusb{background:var(--pink);color:var(--navy);font-size:20px;font-weight:700;line-height:1}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:16px;border-radius:22px;min-height:124px;justify-content:flex-end;border:2px solid transparent;transition:transform .18s,box-shadow .18s,border-color .18s}
.pcard b{font-family:'Bricolage Grotesque',sans-serif;font-size:19px}.pcard span{font-size:13px}.pcard small{font-size:12px;opacity:.85}
.pcard.on{border-color:var(--pink)}
.pcard.add{background:transparent;border:2px dashed var(--pink);color:var(--ink);align-items:center;justify-content:center}
.pl{font-size:14px;font-weight:700;color:var(--muted)}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dd{position:relative;display:inline-block}
.pn{display:inline-flex;align-items:center;gap:8px;font:800 26px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;padding:2px 8px 2px 6px;border-radius:14px;transition:background-color .15s}
.pn.s{font:700 14px 'DM Sans',sans-serif;letter-spacing:0;padding:3px 8px;background:var(--chip);color:var(--cink)}
.cdot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:230px;background:var(--surface);border:1px solid transparent;border-radius:18px;padding:6px;box-shadow:0 14px 34px rgba(30,58,88,.25)}

.menu .newp{color:var(--pink);font-weight:700;border-top:1px solid var(--line);border-radius:0 0 12px 12px;margin-top:4px}
.chip.dash,.day.dash{background:transparent;border:2px dashed var(--pink);display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.day.dash{padding:10px 14px}
.chips{align-items:center}
.sbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.zoom{display:inline-flex;align-items:center;gap:2px;background:var(--chip);border-radius:999px;padding:3px}
.zoom button{min-width:30px;height:28px;padding:0 8px;border-radius:999px;font-weight:700;font-size:13px;color:var(--cink);transition:background-color .15s}
.zoom span{min-width:46px;text-align:center;font-size:13px;font-weight:700;color:var(--cink)}
.mini{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--chip);color:var(--cink);font-size:13px;font-weight:700;transition:transform .15s,background-color .15s,color .15s}
.mini[aria-pressed="true"]{background:var(--pink);color:var(--navy)}
.sc-scroll{overflow-x:auto;border-radius:24px;margin-bottom:6px}
.sc-wrap{margin:0 auto}
.scene.lo .lb{opacity:0;transition:opacity .15s}
.scene.lo .node:hover .lb,.scene.lo .node.sel .lb,.scene.lo .node.hv .lb{opacity:1}
.rg{display:none}.rg.on{display:block}
.node.sel circle.n{transform:scale(1.25)}
.node.hv circle.n{transform:scale(1.3);stroke-width:4}
.stop{margin-top:14px;margin-bottom:0}
.stop.hv .card,.stop:hover .card{box-shadow:inset 0 0 0 999px rgba(255,120,167,.2),0 0 0 2px var(--pink)}
.stop.sel .card{box-shadow:inset 0 0 0 999px rgba(255,120,167,.14),0 0 0 2px var(--pink),0 8px 18px rgba(255,120,167,.32)}
.stop.sel .dot{border-color:var(--pink)}
.stop.hv .dot{border-color:var(--pink);transform:scale(1.12)}
.chead{display:flex;justify-content:space-between;align-items:center;min-height:28px}
.acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.card:hover .acts,.card:focus-within .acts,.stop.sel .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.acts button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;transition:background-color .15s,transform .15s}
.note{font-size:13px;margin-top:6px;line-height:1.45}
.simg{display:block;max-width:100%;max-height:170px;border-radius:12px;margin-top:8px}
.slink{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font-size:13px;font-weight:700;color:inherit;text-decoration:underline}
.leg{display:block;margin-top:6px;font-size:12px;opacity:.7}
.stop .dot{cursor:pointer}
.empty{list-style:none;padding:18px;border:2px solid transparent;background:var(--surface);border-radius:18px;color:var(--muted);text-align:center;font-size:14px}
.tl .empty{margin-left:0}
.extras{display:grid;gap:14px;margin-top:22px}
.xcard{background:var(--surface);border:1px solid transparent;border-radius:22px;padding:16px}
.xh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.xh b{font-family:'Bricolage Grotesque',sans-serif;font-size:19px}
.chk{list-style:none;padding:0}
.chk li{display:flex;align-items:center;gap:6px;margin:4px 0}
.chk li>button:first-child{flex:1;display:flex;gap:10px;align-items:center;text-align:left;padding:6px 4px;border-radius:10px;transition:background-color .15s}
.chk i{width:20px;height:20px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;flex:0 0 20px}
.chk i svg{width:13px;height:13px}
.chk [aria-pressed="true"] i{background:var(--pink);border-color:var(--pink);color:var(--navy)}
.chk [aria-pressed="true"]{text-decoration:line-through;color:var(--muted)}
.fcard{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:var(--bg);margin-bottom:8px;transition:transform .15s,box-shadow .15s}
.fcard b{display:block}.fcard span{font-size:13px;color:var(--muted)}
/* explore */
.search{transition:border-color .15s,box-shadow .15s}
.search:hover,.search:focus-within{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,120,167,.2)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;outline:none}
.xsug{display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px dashed var(--pink);text-align:left;margin-bottom:10px;font-weight:700;transition:background-color .15s,transform .15s}
.hhead{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px}
.link{font-weight:700;text-decoration:underline;font-size:13px;color:var(--muted)}
.place .thumb{flex:0 0 56px;height:56px;width:56px}
.place a.ico,.place .ico{flex:0 0 34px}
.place{transition:transform .18s,box-shadow .18s,border-color .18s}
/* calendar */
.cd{position:relative;transition:transform .15s,background-color .15s,filter .15s;cursor:pointer;border-radius:12px}
.cd:not(.hit):hover{background:var(--chip)}
.cd.hit:hover{filter:brightness(1.08);transform:scale(1.1);z-index:1}
.cd.s{border-radius:20px 0 0 20px}.cd.e{border-radius:0 20px 20px 0}.cd.s.e{border-radius:20px}
.cd.pv{background:rgba(255,120,167,.22)}
.cd.sel{background:rgba(255,120,167,.4);box-shadow:inset 0 0 0 2px var(--pink)}
.cd.hit.sel{filter:brightness(.95)}
.plus{position:absolute;top:-8px;right:-4px;width:22px;height:22px;border-radius:50%;background:var(--pink);color:var(--navy);font-size:15px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:2;transition:transform .15s}
.plus:hover{transform:scale(1.2)}
.selbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--surface);border:1px solid var(--pink);border-radius:18px;padding:10px 14px;margin-top:12px}
.selbar .btn{margin:0;padding:9px 14px}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 10px}
.newb{margin:0;padding:10px 16px}
/* modal */
.panel{max-height:92%;overflow-y:auto}
.f{margin-bottom:12px}.fk{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:700}
.panel input,.panel select,.panel textarea{width:100%;padding:11px 14px;border-radius:14px;border:1px solid transparent;background:var(--bg);color:var(--ink);font:inherit;margin-top:0;transition:border-color .15s,box-shadow .15s}
.panel input:hover,.panel select:hover,.panel textarea:hover,.rte:hover{border-color:var(--pink)}
.panel input:focus,.panel select:focus,.panel textarea:focus,.rte:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,120,167,.25)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dest-date-fields{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
.dest-date-fields>.f{min-width:0}
.dest-date-fields input{display:block;width:100%;min-width:0;max-width:100%;padding-left:8px;padding-right:8px;font-size:14px}
@media(max-width:360px){.dest-date-fields{grid-template-columns:minmax(0,1fr)}}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.swb{width:30px;height:30px;border-radius:50%;border:2px solid transparent;transition:transform .15s}
.swb.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--pink)}
.swb.none{background:var(--surface);color:var(--muted);font-size:14px}
.tb{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.tb button{min-width:32px;height:32px;border-radius:9px;background:var(--chip);color:var(--cink);font-weight:700;transition:background-color .15s,transform .15s}
.dotc{display:inline-block;width:14px;height:14px;border-radius:50%}
.rte{min-height:90px;border:1px solid transparent;border-radius:14px;padding:10px 12px;background:var(--bg);line-height:1.45;transition:border-color .15s,box-shadow .15s}
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.mc{padding:7px 12px;border-radius:999px;background:var(--chip);color:var(--cink);font-size:13px;font-weight:600;transition:background-color .15s,transform .15s}
.mc.on{background:var(--pink);color:var(--navy)}
.addrow{display:flex;gap:8px}.addrow input{flex:1}
.mfoot{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:16px}
.mfoot .btn{margin:0;width:auto}
.danger{margin-right:auto;color:#C2185B;font-weight:700;padding:9px 14px;border-radius:999px;border:2px solid #C2185B;transition:background-color .15s,color .15s}
.ghost{padding:10px 16px;border-radius:999px;font-weight:700;transition:background-color .15s}
.mlist{list-style:none;padding:0;margin:0 0 12px}
.mlist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.mlist li b{flex:1}.mlist button{font-size:13px;color:var(--muted);text-decoration:underline}
.bad{border-color:#C2185B!important;animation:shk .3s}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;white-space:nowrap}
@media (hover:hover){
.pill:hover,.pcard:hover,.fcard:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(47,88,129,.2);border-color:var(--pink)}
.plusb:hover,.ico:hover{transform:scale(1.12);background:var(--pink);color:var(--navy)}
.pn:hover,.menu button:hover,.chk li>button:first-child:hover,.zoom button:hover,.ghost:hover,.acts button:hover,.hero .hd button:hover{background:rgba(255,120,167,.3)}
.hero .hd button:hover{transform:translateY(-2px)}
.mini:hover,.mc:hover,.tb button:hover{background:var(--pink);color:var(--navy);transform:translateY(-2px)}
.swb:hover{transform:scale(1.15)}
.xsug:hover{background:var(--chip);transform:translateY(-2px)}
.danger:hover{background:#C2185B;color:#fff}
.link:hover{color:var(--pink)}
.acts button:hover{transform:scale(1.1)}
}

/* v3 */
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 2px}
.shead b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:19px}.shead span{font-size:13px;color:var(--muted)}

@media (max-width:440px){.place .thumb{display:none}}
@media (hover:hover){.addli button:hover,.empty .mini:hover{background:rgba(255,120,167,.28);transform:translateY(-2px)}.epill:hover rect{filter:brightness(.96);stroke-width:3.5}button.mate:hover{transform:translateY(-3px);z-index:2}.fcard:hover .fe{color:var(--pink)}}

.box{background:var(--surface);border:1px solid transparent;border-radius:22px;padding:12px 14px;margin-bottom:12px}

.bl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ba{display:flex;gap:6px}
.mini.add{background:var(--pink);color:var(--navy)}
.box .chips{margin:0;gap:12px 10px;padding-top:6px}
.mrow{display:flex;gap:12px 10px;flex-wrap:wrap;padding-top:6px}
.mp{display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:14px;transition:border-color .15s,transform .15s}
.mav{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-style:normal;font-weight:700;font-size:13px}
.box .days{margin:0 -6px;padding:12px 12px 8px;gap:12px 10px}
.day{transition:transform .18s,border-color .18s,box-shadow .18s}
.srow{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.sc-outer{position:relative;flex:1;min-width:0}
.sc-outer .tip{transform:none}
.sbar{flex:0 0 46px;flex-direction:column;flex-wrap:nowrap;align-items:center;gap:6px;background:var(--surface);border:1px solid transparent;border-radius:18px;padding:8px 5px;margin:0}

.nr{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:12px}
#explore .top,#budget .top{margin-bottom:22px;align-items:flex-start}

.hhead{margin:20px 0 14px}

.pcard{justify-content:center}

#budget #b2 .xw.erow>.xdel{
  top:50%;
  right:3px;
  transform:translateY(-50%) scale(.6);
  transform-origin:center;
}
#budget #b2 .xw.erow:hover>.xdel,
#budget #b2 .xw.erow:focus-within>.xdel{
  transform:translateY(-50%) scale(1);
}
#budget #b2 .xw.erow>.xdel:hover{
  transform:translateY(-50%) scale(1.08)!important;
}
@media (hover:none){
  #budget #b2 .xw.erow>.xdel{transform:translateY(-50%) scale(1);}
}
@media(max-width:860px){
  #budget .snapshot-title{font-size:12px;margin-bottom:7px;}
  #budget .snapshot-item{min-height:90px;padding:8px 9px;gap:5px;}
  #budget #b4 .balance-rows{padding:7px 6px 9px;}
}



/* Latest Budget spacing polish: slightly narrower expense rows, centered delete icon,
   and more deliberate spacing/color hierarchy for Spending Snapshot. */
#budget #b2 .xw.erow > .er{
  flex:0 0 97%;
  width:97%;
  max-width:97%;
  min-width:0;
}
#budget #b2 .xw.erow > .xdel{
  display:grid;
  place-items:center;
  padding:0;
  line-height:0;
  box-sizing:border-box;
}
#budget #b2 .xw.erow > .xdel svg{
  display:block;
  width:12px;
  height:12px;
  margin:0;
  flex:none;
}
#budget #b1 .spend-snapshot{
  margin-top:16px;
  padding-top:14px;
}
#budget #b1 .snapshot-title{
  margin-bottom:9px;
}
#budget #b1 .snapshot-label{
  color:var(--pink);
}
@media(max-width:860px){
  #budget #b2 .xw.erow > .er{
    flex-basis:97%;
    width:97%;
    max-width:97%;
  }
  #budget #b1 .spend-snapshot{
    margin-top:16px;
    padding-top:14px;
  }
  #budget #b1 .snapshot-title{margin-bottom:9px;}
}

.mbrand .logo{width:44px;height:44px;flex:0 0 44px}
.brand .logo{width:48px;height:48px;flex:0 0 48px}

/* Join: choose your name */
.jp small{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.7;margin-left:6px}
.panel.joinm .f{margin-top:14px}
.jmsg{margin:8px 2px 0;font-size:13px;color:var(--muted);min-height:1.4em}
.jmsg.err{color:var(--neg)}.jmsg.ok{color:var(--pos)}
#jname[aria-invalid="true"]{border-color:#C2185B}
.btn[aria-disabled="true"]{opacity:.5;box-shadow:none}
.btn[aria-disabled="true"]:hover{transform:none;box-shadow:none}
.panel.joinm .mfoot{position:sticky;bottom:0;background:var(--surface);padding:12px 0 2px;margin-top:10px;z-index:2}


/* Mobile Plan UX: keep configured option chips clean; deletion remains available
   from the relevant edit dialogs. This override is scoped to Plan only. */
@media (hover:none){
  #plan .xdel{display:none !important;}
}

/* Home destination overflow: compact count control and non-expanding plan-card route */
.hero .hd .hd-count{width:34px;height:34px;min-width:34px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--pink);color:var(--navy);font-size:12px;font-weight:800;box-shadow:0 3px 10px rgba(30,58,88,.12)}
.hero .hero-route{overflow-wrap:anywhere;line-height:1.4}
.hero .hero-route-more{display:inline-flex;align-items:center;justify-content:center;padding:1px 7px;border-radius:999px;background:var(--pink);color:var(--navy);font-weight:800;white-space:nowrap;cursor:pointer}
.pcard small.dest-summary{display:flex;align-items:center;gap:5px;min-width:0;max-width:100%;height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest-summary-names{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dest-card-more{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:2px 6px;background:var(--pink);color:var(--navy);font-size:11px;font-weight:800;line-height:1.2;cursor:pointer}
.dest-popover{position:fixed;z-index:9999;box-sizing:border-box;max-height:min(300px,55vh);overflow:auto;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:0 14px 38px rgba(30,58,88,.22);overscroll-behavior:contain}
.dest-popover-title{padding:7px 9px 9px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.dest-pop-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 11px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:600 13px 'DM Sans',system-ui,sans-serif;text-align:left;line-height:1.35}
button.dest-pop-item{cursor:pointer}
.dest-pop-item:hover,.dest-pop-item.active{background:var(--chip)}
.dest-pop-item i{font-size:10px;font-style:normal;color:var(--rose);font-weight:800}
.dest-pop-item.static{pointer-events:none}
/* A brand-new browser starts with an empty personal workspace, not demo trips. */
.hero.is-empty{min-height:0;height:auto;padding:0;background:transparent;color:var(--ink);overflow:visible;display:block}
.hero.is-empty>.empty-welcome{margin:0;padding:24px;border-radius:24px;background:var(--surface);border:1px solid var(--line);color:var(--ink);box-shadow:0 8px 28px rgba(30,58,88,.06)}
.empty-welcome .empty-kicker{display:block;color:var(--rose);font-size:10px;font-weight:800;letter-spacing:.12em;margin-bottom:12px}
.hero.is-empty .empty-welcome h1{font-size:clamp(26px,5vw,34px);line-height:1.08;letter-spacing:-.035em;color:var(--ink);margin:0 0 10px}
.hero.is-empty .empty-welcome p{font-size:14px;line-height:1.55;color:var(--muted);margin:0;max-width:440px}
.empty-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.empty-actions .btn{margin-top:0}
.empty-actions .ghost{display:inline-flex;align-items:center;justify-content:center;padding:10px 15px;border-radius:999px;border:1px solid var(--line);color:var(--ink);font-weight:700}
.empty-name{display:block;margin-top:15px;padding:0;border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.empty-plans{grid-column:1/-1;padding:18px 16px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);font-size:13px}
.pills[hidden]{display:none!important}
.tabs button:disabled{opacity:.32;cursor:not-allowed;box-shadow:none;transform:none}
@media(max-width:520px){.hero.is-empty>.empty-welcome{padding:22px 18px}.empty-actions{gap:8px}.pcard small.dest-summary{max-width:100%}}


.personal-gate .mfoot button[data-close]{display:none}
.personal-gate .access-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.personal-gate .access-actions button{flex:1 1 145px}
.personal-gate .access-code-box{display:flex;align-items:center;gap:8px;min-width:0}
.personal-gate .access-code-box input{min-width:0;flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.personal-gate .access-code-box button{flex:0 0 auto}
.access-code-box{display:flex;align-items:center;gap:8px;min-width:0}
.access-code-box input{min-width:0;flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.access-code-box button{flex:0 0 auto}


/* Personal-space UX: cleanly align the switch action and make local-plan migration explicit. */
.panel.profilem .shsec [data-act="switchspace"]{
  display:flex;width:100%;justify-content:flex-start;align-items:center;text-align:left;
  margin:10px 0 0;padding:10px 12px;border-radius:12px;line-height:1.35;
}
.space-import-choice{margin-top:10px;padding:12px 13px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.space-import-choice label{display:flex;align-items:flex-start;gap:10px;color:var(--ink);font-size:13px;font-weight:700;line-height:1.4}
.panel .space-import-choice input[type="checkbox"]{width:18px;height:18px;flex:0 0 18px;margin:1px 0 0;padding:0;accent-color:var(--pink)}
.space-import-choice p{margin-top:8px;font-size:12px;line-height:1.45;color:var(--muted)}
.panel.moreplansm .more-plan-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.panel.moreplansm .more-plan-row{display:flex;align-items:center;gap:11px;width:100%;min-width:0;padding:12px;border-radius:14px;background:var(--bg);text-align:left}
.panel.moreplansm .more-plan-row .cdot{width:12px;height:12px;flex:0 0 12px}
.panel.moreplansm .more-plan-row .more-plan-copy{display:flex;flex:1;flex-direction:column;min-width:0;gap:3px}
.panel.moreplansm .more-plan-row b{font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.panel.moreplansm .more-plan-row small{font-size:12px;color:var(--muted);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel.moreplansm .more-plan-row .more-plan-arrow{font-size:20px;color:var(--muted);flex:0 0 auto}
@media(max-width:520px){
  #home .plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;gap:10px;margin-top:12px}

/* ===== Plyt mobile UI refinements: date/time controls follow desktop form rhythm ===== */
.mbrand{width:100%;}
.mbrand>.avatar{margin-left:auto;flex:0 0 42px;width:42px;height:42px;}
/* Keep the same two-column grid, 10px gutter, label rhythm and control sizing as desktop. */
.date-pair{position:relative;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start;}
.date-pair>.f{min-width:0;}
/* A subtle divider sits in the gutter without joining the two input surfaces together. */
.date-pair::after{content:"";position:absolute;left:50%;top:20px;height:42px;width:1px;transform:translateX(-50%);background:var(--muted);opacity:.55;pointer-events:none;}
.picker-shell{position:relative;min-width:0;}
/* Match desktop .panel controls (11px 14px, 14px corners, inherited font); reserve room for the visual chevron. */
.panel .picker-shell input{display:block;width:100%;min-width:0;max-width:100%;padding:11px 34px 11px 14px;font:inherit;font-variant-numeric:tabular-nums;}
.picker-chevron{position:absolute;right:9px;top:50%;transform:translateY(-50%);display:grid;place-items:center;color:var(--ink);pointer-events:none;}
.panel .picker-shell input[type="date"]::-webkit-calendar-picker-indicator,
.panel .picker-shell input[type="time"]::-webkit-calendar-picker-indicator{opacity:0;position:absolute;right:0;width:34px;height:100%;cursor:pointer;}
@media(max-width:360px){
 .date-pair{gap:8px;}
 .date-pair::after{height:39px;}
 .panel .picker-shell input{padding-left:8px;padding-right:28px;font-size:13px;}
 .picker-chevron{right:6px;}
 .picker-chevron svg{width:16px;height:16px;}
 .panel .picker-shell input[type="date"]::-webkit-calendar-picker-indicator,
 .panel .picker-shell input[type="time"]::-webkit-calendar-picker-indicator{width:28px;}
}

}

function setupSummaryOverflow(){

 chips.forEach(w=>{
  const all=[...w.querySelectorAll('.dstop')];let more=w.querySelector('.dmore');
  if(!more)return;
  all.forEach(x=>{x.style.display='inline-flex'});more.hidden=true;more.removeAttribute('data-tooltip');more.textContent='';
  if(!all.length)return;
  const maxH=56, top=w.getBoundingClientRect().top;
  let visible=all.length;
  // Keep all chips that fit in the two-line display area.
  for(let i=0;i<all.length;i++){
   const r=all[i].getBoundingClientRect();
   if(r.bottom-top>maxH+1){visible=i;break;}
  }
  if(visible>=all.length)return;
  const apply=()=>{
   all.forEach((el,i)=>el.style.display=i<visible?'inline-flex':'none');
   const hidden=all.slice(visible);
   more.hidden=false;more.textContent='+'+hidden.length;
   more.setAttribute('data-tooltip',hidden.map(el=>el.textContent.trim()).join(' · '));

  let guard=0;

 });
}

const fsUrl=(c,q)=>`https://firestore.googleapis.com/v1/projects/${encodeURIComponent(CL.p)}/databases/(default)/documents/shares/${encodeURIComponent(c)}?key=${encodeURIComponent(CL.k)}${q?'&'+q:''}`;

async function personalGet(code){const r=await fetch(personalUrl(code));if(r.status===404)return null;if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json(),f=j.fields||{};return{d:f.d?f.d.stringValue:'',r:f.r?+f.r.integerValue:0,t:j.updateTime};}

function personalSnapshot(name,uid){return JSON.stringify({v:1,uid:String(uid||SPACE.uid||''),name:String(name||SPACE.name||ME||'').trim(),plans:P.map(p=>p.sync&&p.sync.code?{id:p.id,shareCode:p.sync.code}:{id:p.id,shareCode:'',plan:strip(p)}),H:H||[],KM:KM||[]});}
function mergePlanImages(plan,old){if(!old||!plan)return plan;const imgs={};(old.dests||[]).forEach(d=>(d.stops||[]).forEach(t=>{if(t.img)imgs[t.id]=t.img}));(plan.dests||[]).forEach(d=>(d.stops||[]).forEach(t=>{if(imgs[t.id])t.img=imgs[t.id]}));return plan;}
async function inflatePersonalSnapshot(data,code){SPACE.name=String(data.name||SPACE.name||ME||'').trim();SPACE.code=code;const old=new Map((P||[]).map(p=>[p.id,p])),plans=[];for(const item of (data.plans||[])){if(item.shareCode){const rem=await fsGet(item.shareCode);if(!rem)throw new Error('A shared plan in your space could not be found. Check its invite code and Firestore Rules.');const raw=JSON.parse(rem.d),prev=old.get(raw.id)||old.get(item.id);const plan=mergePlanImages(Object.assign({},raw,{sync:{code:item.shareCode,rev:rem.r,base:rem.d,at:Date.now(),err:''}}),prev);plans.push(plan);}else if(item.plan){const plan=JSON.parse(JSON.stringify(item.plan));plans.push(mergePlanImages(plan,old.get(plan.id)));}}
 P=plans;H=Array.isArray(data.H)?data.H:[];KM=Array.isArray(data.KM)?data.KM:[...new Set(P.flatMap(p=>p.mates||[]))];ME=String(data.name||ME||'').trim();try{localStorage.setItem('plyt-me',ME)}catch(e){};

function schedulePersonalSync(){if(!SPACE.active||SPACE.busy)return;clearTimeout(SPACE.timer);if(personalSnapshot()===SPACE.base)return;SPACE.timer=setTimeout(()=>syncPersonalSpace().catch(e=>{if(SPACE.active)toast('Personal-space sync failed: '+(e.message||e))}),1200);}
async function syncPersonalSpace(){if(!SPACE.active||!cloudOn()||SPACE.busy)return;SPACE.busy=true;let ok=false;try{for(let attempt=0;attempt<4;attempt++){const remote=await personalGet(SPACE.code);if(!remote)throw new Error('Personal space not found. Check your access code and Firestore Rules.');const localD=personalSnapshot(),baseD=SPACE.base||remote.d;let merged;try{merged=merge3(JSON.parse(baseD),JSON.parse(localD),JSON.parse(remote.d));}catch(e){throw new Error('Could not merge your personal-space data. Please reload the app.')}const mergedD=JSON.stringify(merged);if(remote.d!==baseD){await inflatePersonalSnapshot(merged,SPACE.code);}

function personalErrorText(e){const m=String(e&&e.message||e);if(m.includes('HTTP 403'))return 'Firebase denied access. Publish the updated firestore.rules that includes /personalSpaces before using personal access codes.';if(m.includes('HTTP 404'))return 'Personal space not found. Check both your name and access code.';return m;}

async function openExistingPersonalSpaceFromGate(){const name=$('#spaceName').value.trim(),code=cleanAccessCode($('#spaceCode').value),msg=$('#spacemsg'),btn=$('#msave');if(!name||name.length>40){msg.textContent='Enter your name (up to 40 characters).';msg.className='jmsg err';return;}if(!/^[A-HJ-NP-Z2-9]{20}$/.test(code)){msg.textContent='Enter the full 20-character access code.';msg.className='jmsg err';return;}if(btn)btn.disabled=true;msg.textContent='Checking your personal space…';msg.className='jmsg';try{const rec=await personalGet(code);if(!rec){msg.textContent='Name or access code is incorrect. Check both and try again.';msg.className='jmsg err';return;}const data=JSON.parse(rec.d);if(spaceNameKey(name)!==spaceNameKey(data.name)){msg.textContent='Name or access code is incorrect. Check both and try again.';msg.className='jmsg err';return;}await activatePersonalSpace(code,data,rec);closeM();render();toast('Welcome back, '+data.name);if(personalSnapshot()!==SPACE.base)schedulePersonalSync();}catch(e){msg.textContent=personalErrorText(e);msg.className='jmsg err';}finally{if($('#msave'))$('#msave').disabled=false;}}

function adopt(s,m,rev,md){const old=P.find(x=>x.sync===s);if(!old)return;const imgs={};old.dests.forEach(d=>d.stops.forEach(t=>{if(t.img)imgs[t.id]=t.img}));const np=Object.assign({},m,{sync:s});np.dests.forEach(d=>d.stops.forEach(t=>{if(imgs[t.id])t.img=imgs[t.id]}));P[P.indexOf(old)]=np;s.rev=rev;s.base=md}

   if(rem){const R=JSON.parse(rem.d);merged=merge3(s.base?JSON.parse(s.base):R,local,R);rev=rem.r;pre='currentDocument.updateTime='+encodeURIComponent(rem.t)}

 if(k==='d'){const x=p.dests.find(y=>y.id===v);if(!x)return;if(p.dests.length<2){toast('A plan needs at least one destination');return}ask(`Delete destination \u201c${esc(x.name)}\u201d and its stops?`,()=>{p.dests=p.dests.filter(y=>y!==x);U.did=null;U.day=0;U.sel=0;render()})}
 else if(k==='m'){const n=p.mates[+v];if(hasBudgetReferences(p,n)){toast('This member has Budget records. Update or delete those expenses/payments before removing them from the plan.');return;}ask(`Remove ${esc(n)} from \u201c${esc(p.name)}\u201d?`,()=>{p.mates.splice(+v,1);render()},'Remove')}
 else if(k==='y'){const ds=dd(d),old=ds[+v];if(ds.length<2){toast('A destination needs at least one day');return}const c=d.stops.filter(s=>s.date===old).length;ask(`Delete ${esc(dayL(d,+v))} and its ${c} stop${c===1?'':'s'}?`,()=>{d.days=d.days.filter(x=>x!==old);d.stops=d.stops.filter(s=>s.date!==old);if(d.dl)delete d.dl[old];U.day=0;U.sel=0;render()})}
 else if(k==='e'){const r=findExp(v);if(r)ask(`Delete \u201c${esc(r.e.t)}\u201d?`,()=>{r.p.bud.exp=r.p.bud.exp.filter(x=>x!==r.e);render()})}
 else if(k==='t'){const s=p.bud.set.find(x=>x.id===v);if(s)ask('Delete this payment record?',()=>{p.bud.set=p.bud.set.filter(x=>x!==s);render()})}
 else if(k==='s'){const r=findStop(v);if(r)ask(`Delete \u201c${esc(r.s.name)}\u201d?`,()=>{r.d.stops=r.d.stops.filter(x=>x!==r.s);U.sel=0;render()})}}
function act(a,D){
 hideMenus();
 // Lazily invoke each action. A missing helper for one action must never break all buttons.
 const actions={
  plan:()=>openPlan({range:D.range}),
  editplan:()=>openPlan({pid:U.pid}),
  createspace:()=>createPersonalSpaceFromGate(),
  generategatecode:()=>generateGateAccessCode(),

  joinnewuser:()=>openJoinNewSpace(),
  backjoinoptions:()=>showJoinAccessOptions(),
  generatejoincode:()=>generateJoinSpaceCode(),
  copyjoincode:()=>copyJoinSpaceCode(),
  moreplans:()=>openMorePlans(),
  joinfromgate:()=>{closeM();openJoin()},
  copyspacecode:()=>copyPersonalCode(),
  switchspace:()=>switchPersonalSpace(),
  personalaccess:()=>{closeM();openPersonalGate()},
  dest:()=>openDest(),
  editdest:()=>openDest({edit:1}),
  stop:()=>openStop({}),
  day:()=>openDay({}),
  editday:()=>openDay({edit:1}),
  flight:()=>openFlight({}),
  pack:()=>openPack(),
  me:()=>openMe(),
  shareplan:()=>openSharePlan(),
  cloud:()=>openCloud(),
  startshare:()=>startShare(),
  copylink:()=>copyLink(),
  nativeshare:()=>nativeShare(),
  syncnow:()=>syncBtn(),
  stopshare:()=>stopShare(),
  snap:()=>snapShare(),
  join:()=>openJoin(),
  testcloud:()=>testCloud(),
  maptoggle:()=>{U.mh=!U.mh;renderExplore()},
  expense:()=>openExpense({}),
  settle:()=>openSettle({}),
  bset:()=>openBset(),
  share:()=>openBShare(),
  mates:()=>openMates(),
  addmate:()=>{openMates();setTimeout(()=>{const i=$('#mnew2');if(i)i.focus()},40)}
 };
 const run=actions[a];
 if(typeof run!=='function'){
  console.warn('Unknown Plyt action:',a);
  toast('This action is unavailable in this version. Reload Plyt and try again.');
  return;
 }
 try{
  const result=run();
  if(result&&typeof result.then==='function')result.catch(err=>{
   console.error('Plyt action failed:',a,err);
   toast('Could not complete this action: '+String(err&&err.message||err));
  });
 }catch(err){
  console.error('Plyt action failed:',a,err);
  toast('Could not complete this action: '+String(err&&err.message||err));
 }
}

});

   if(p&&(!opened||opened.dataset.anchor!==key))openDestinationPopover(more,p,'card');

 }
 if(e.key==='Escape')closeDestinationPopover();
});

 if(D.editp){hideMenus();openPlan({pid:D.editp});return}
 if(D.xedit){openHist(D.xedit);return}
 if(D.invite!==undefined){inviteMate(D.invite);return}
 if(D.xmap){const h=H.find(x=>x.id===D.xmap);if(h){U.mq=h.n+' '+xloc();U.mh=false;renderExplore();const mb=$('#mapbox');if(mb)mb.scrollIntoView({block:'nearest',behavior:'smooth'})}return}
 if(D.nm!==undefined){joinPick(D.nm);return}
 if(D.eexp){openExpense({eid:D.eexp});return}
 if(D.eset){openSettle({sid:D.eset});return}
 if(D.settle!==undefined){const p=cp(),s=suggest(calc(p).b)[+D.settle];if(s){p.bud.set.push({id:nid(),from:s.from,to:s.to,amt:s.amt,date:iso(today)});render();toast('Payment recorded')}return}
 if(D.cat){XS.cat=D.cat;$$('#ecats [data-cat]').forEach(b=>b.classList.toggle('on',b.dataset.cat===XS.cat));return}
 if(D.mode){XS.mode=D.mode;$$('#emode [data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===XS.mode));drawSplit();return}
 if(D.sp!==undefined){const i=XS.sp.indexOf(D.sp);i<0?XS.sp.push(D.sp):XS.sp.splice(i,1);drawSplit();return}
 if(D.xd){const i=D.xd.indexOf(':');delX(D.xd.slice(0,i),D.xd.slice(i+1));return}
 if(D.xmc!==undefined){el.closest('.xw').remove();return}
 if(D.hp){const s=SP(),i=s.findIndex(p=>p.id===U.pid),n=s[(i+ +D.hp+s.length)%s.length];U.pid=n.id;U.did=null;U.day=0;U.sel=0;U.hd=0;U.xp=n.id;render();return}
 if(D.pid){hideMenus();U.pid=D.pid;U.did=null;U.day=0;U.sel=0;U.hd=0;if(D.go)go(D.go);else render();return}
 if(D.go){go(D.go);return}
 if(D.did){U.did=D.did;U.day=0;U.sel=0;render();return}
 if(D.day!==undefined){U.day=+D.day;U.sel=0;render();return}
 if(D.view){U.view=D.view;render();return}
 if(D.zm){zoom(D.zm);return}
 if(D.done){toggleDone(D.done);return}
 if(D.edit){openStop({sid:D.edit,f:D.f});return}
 if(D.pick!==undefined){selStop(+D.pick,false);return}
 if(D.bdone!==undefined){const s=curStop();s?toggleDone(s.id):toast('Add a stop first');return}
 if(D.bedit!==undefined){const s=curStop();s?openStop({sid:s.id}):toast('Add a stop first');return}
 if(D.bdel!==undefined){const s=curStop();if(!s){toast('Add a stop first');return}ask(`Delete \u201c${esc(s.name)}\u201d?`,()=>{cd().stops=cd().stops.filter(x=>x!==s);U.sel=0;render()});return}
 if(D.hd!==undefined){U.hd=+D.hd;renderHome();return}
 if(D.xs!==undefined){doSearch();return}
 if(D.xadd){const h=H.find(x=>x.id===D.xadd);openStop({name:h.n,pid:U.xp});return}
 if(D.xdel){H=H.filter(x=>x.id!==D.xdel);renderExplore();return}
 if(D.xclear!==undefined){H=[];renderExplore();return}
 if(D.xp){hideMenus();U.xp=D.xp;U.mq='';renderExplore();return}
 if(D.cm){U.cm=new Date(U.cm.getFullYear(),U.cm.getMonth()+ +D.cm,1);renderCal();return}
 if(D.csel!==undefined){U.a=U.b=null;renderCal();return}
 if(D.d){if(!U.a||U.b){U.a=D.d;U.b=null}else U.b=D.d;renderCal();return}
 if(D.pk!==undefined){const it=cp().packing.items[+D.pk];it.d=!it.d;render();return}
 if(D.ef){openFlight({fid:D.ef});return}
 if(D.mc!==undefined){el.classList.toggle('on');return}
 if(D.dc!==undefined){el.remove();return}
 if(el.classList.contains('swb')){[...el.parentElement.children].forEach(b=>b.classList.remove('on'));el.classList.add('on');return}
 if(D.rmimg!==undefined){IMG='';$('#fprev').hidden=true;$('#fimg').value='';return}
 if(D.mrm!==undefined){const p=cp(),n=p.mates[+D.mrm];if(hasBudgetReferences(p,n)){toast('This member has Budget records. Update or delete those expenses/payments before removing them from the plan.');return;}p.mates.splice(+D.mrm,1);render();openMates();return}
 if(D.pli!==undefined){PK[+D.pli].d=!PK[+D.pli].d;drawPK();return}
 if(D.plr!==undefined){PK.splice(+D.plr,1);drawPK();return}
 switch(el.id){case'pnav':toggleMenu('#pmenu');break;case'xnav':toggleMenu('#xmenu');break;case'bnav':toggleMenu('#bmenu');break;case'dadd':addChip('dnew','dch','dc');break;case'madd2':addChip('mnew','mch','mc');break;
  case'padd':{const t=$('#pnew').value.trim();if(t){PK.push({id:nid(),t,d:false});$('#pnew').value='';drawPK()}break}
  case'madd3':{const v=$('#mnew2').value.trim();if(v){cp().mates.push(v);if(!KM.includes(v))KM.push(v);render();openMates();setTimeout(()=>$('#mnew2').focus(),30)}break}}});

document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='xpl')xplChange(t.value);
 if(t.dataset&&t.dataset.mi!==undefined){const p=cp(),v=t.value.trim(),old=p.mates[+t.dataset.mi];if(v&&v!==old){KM=KM.map(x=>x===old?v:x);renameMate(old,v)}else t.value=old;render()}

 if(t.id==='pp'){const p=P.find(x=>x.id===t.value);PK=p.packing.items.map(x=>({...x}));$('#rte').innerHTML=p.packing.note;drawPK()}});

document.addEventListener('mouseover',e=>{
 if(!supportsDestinationHover())return;
 const trigger=e.target.closest&&e.target.closest('[data-card-dests],[data-route-dests]');
 if(trigger){
  if(e.relatedTarget&&trigger.contains(e.relatedTarget))return;
  clearTimeout(destPopoverCloseTimer);
  const id=trigger.dataset.cardDests||trigger.dataset.routeDests,p=P.find(x=>x.id===id);
  if(p){const key='card-'+p.id,opened=$('#dest-popover');if(!opened||opened.dataset.anchor!==key)openDestinationPopover(trigger,p,'card');}
  return;
 }
 if(e.target.closest&&e.target.closest('#dest-popover'))clearTimeout(destPopoverCloseTimer);
});
document.addEventListener('mouseout',e=>{
 if(!supportsDestinationHover())return;
 const trigger=e.target.closest&&e.target.closest('[data-card-dests],[data-route-dests]');
 const pop=e.target.closest&&e.target.closest('#dest-popover');
 if(!trigger&&!pop)return;
 const next=e.relatedTarget;
 if(next&&next.closest&& (next.closest('[data-card-dests],[data-route-dests]')||next.closest('#dest-popover')))return;
 if(trigger&&next&&trigger.contains(next))return;
 clearTimeout(destPopoverCloseTimer);destPopoverCloseTimer=setTimeout(closeDestinationPopover,180);
});
